[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-response-cache-disk"
version = "0.1.0"
description = "SQLite-backed disk cache for LLM responses"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["llm", "cache", "sqlite", "disk", "openai", "anthropic", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/MukundaKatta/llm-response-cache-disk"
Repository = "https://github.com/MukundaKatta/llm-response-cache-disk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_response_cache_disk = ["py.typed"]
